[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "4matter"
dynamic = ["version"]
description = "A retro-occult terminal utility for formatting, preparing and zero-filling USB drives on Linux"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["textual>=0.86,<9"]
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
4matter = "fourmatter.cli:main"

[tool.setuptools.dynamic]
version = { attr = "fourmatter.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fourmatter = ["styles/*.tcss", "assets/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
